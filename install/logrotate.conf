    postrotate
        [ ! -S /run/airlock-envoy-web/admin.sock ] || curl -q -fsS --max-time 10 --unix-socket /run/airlock-envoy-web/admin.sock -X POST http://localhost/reopen_logs >/dev/null
    endscript
}
