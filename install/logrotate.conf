# airlock-envoy's logs, rotated by airlock-envoy-logrotate.timer (every 15 minutes, its own
# state file), not by the distribution's daily logrotate run: installed as
# /etc/airlock-envoy/logrotate.conf, outside /etc/logrotate.d.
#
# A log rotates at 100 MiB or once a day. Rotated files carry the time in their name (UTC: the
# unit sets TZ) and are removed by age only (maxage 30; rotate is set far above anything a month can reach), so a
# flood of refused requests can't push the record of what came before it out: it costs disk
# instead. The newest rotated file stays uncompressed until the next rotation (delaycompress):
# Envoy flushes once a second and reopens its files on a flush, so a few lines can still land
# in it. postrotate asks the Envoy that writes the log to reopen it (admin /reopen_logs); a
# stopped Envoy holds no file, so a missing socket is fine. The unit also asks at the start of
# every run, so one failed reopen can't leave Envoy writing a rotated file for good.

/var/log/airlock-envoy/access.jsonl {
    su airlock-envoy airlock-envoy
    create 0600 airlock-envoy airlock-envoy
    daily
    maxsize 100M
    dateext
    dateformat -%Y%m%dT%H%M%SZ
    rotate 100000
    maxage 30
    compress
    delaycompress
    missingok
    notifempty
    postrotate
        [ ! -S /run/airlock-envoy-internal/admin.sock ] || curl -q -fsS --max-time 10 --unix-socket /run/airlock-envoy-internal/admin.sock -X POST http://localhost/reopen_logs >/dev/null
    endscript
}

/var/log/airlock-envoy/web.jsonl {
    su airlock-envoy airlock-envoy
    create 0600 airlock-envoy airlock-envoy
    daily
    maxsize 100M
    dateext
    dateformat -%Y%m%dT%H%M%SZ
    rotate 100000
    maxage 30
    compress
    delaycompress
    missingok
