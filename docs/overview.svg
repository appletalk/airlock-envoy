<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 580" width="1180" height="580" role="img" aria-label="A box with no network reaches out only through its Unix socket. airlock-envoy on the host sends each request one of three ways or refuses it: a tunnel to exact hosts, plain HTTP with a credential it adds, or web to the public internet through a second Envoy whose kernel filter refuses private addresses.">
<defs>
<marker id="a-box" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="a-envoy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker>
<marker id="a-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
</defs>
<rect x="1" y="1" width="1178" height="578" rx="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<rect x="36" y="78" width="236" height="330" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
<text x="154" y="112" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Box</text>
<text x="154" y="132" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">no network of its own</text>
<rect x="52" y="160" width="204" height="64" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<text x="154.0" y="188.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Claude Code</text>
<text x="154.0" y="208.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">HTTPS_PROXY</text>
<rect x="52" y="250" width="204" height="64" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<text x="154.0" y="278.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">git, gh, curl, kubectl</text>
<text x="154.0" y="298.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">plain http:// URLs</text>
<text x="154" y="356" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7f1d1d" text-anchor="middle">no service tokens</text>
<text x="154" y="376" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">only its own Claude login</text>
<circle cx="314" cy="264" r="15" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
<circle cx="314" cy="264" r="5" fill="#334155"/>
<text x="314" y="304" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Unix socket</text>
<text x="314" y="320" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">per listener</text>
<path d="M256,192 C277.5,192 277.5,258 299,258" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a-mute)"/>
<path d="M256,282 C277.5,282 277.5,270 299,270" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a-mute)"/>
<path d="M330,264 L384,264" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a-mute)"/>
<rect x="368" y="40" width="470" height="440" rx="22" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="603" y="74" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#312e81" text-anchor="middle">airlock-envoy</text>
<text x="603" y="94" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">on the host: one allowlist per socket, every decision logged</text>
<rect x="410" y="116" width="400" height="74" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="610.0" y="149.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Tunnel</text>
<text x="610.0" y="169.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">exact host, TLS name checked, never decrypted</text>
<path d="M384,264 C396.0,264 396.0,153 408,153" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="410" y="210" width="400" height="74" rx="14" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="610.0" y="243.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#064e3b" text-anchor="middle">Plain HTTP + credential</text>
<text x="610.0" y="263.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">method and path rules, Envoy opens the TLS</text>
<path d="M384,264 C396.0,264 396.0,247 408,247" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a-green)"/>
<rect x="410" y="304" width="400" height="74" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="610.0" y="337.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#78350f" text-anchor="middle">web</text>
<text x="610.0" y="357.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">any public host name, through the web Envoy</text>
<path d="M384,264 C396.0,264 396.0,341 408,341" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a-amber)"/>
<rect x="410" y="400" width="400" height="58" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="610.0" y="425.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7f1d1d" text-anchor="middle">anything else</text>
<text x="610.0" y="445.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">403, and the reason why</text>
<path d="M384,264 C396.0,264 396.0,429 408,429" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a-red)"/>
<rect x="950" y="116" width="200" height="74" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="1050.0" y="149.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Anthropic API</text>
<text x="1050.0" y="169.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">and hosts you list</text>
<path d="M810,153 L948,153" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="893" y="145" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">TLS end to end</text>
<rect x="950" y="210" width="200" height="74" rx="14" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="1050.0" y="243.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#064e3b" text-anchor="middle">GitHub, git, k8s ...</text>
<text x="1050.0" y="263.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">services that need a token</text>
<path d="M810,247 L948,247" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a-green)"/>
<text x="893" y="239" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#059669" text-anchor="middle">token added</text>
<rect x="950" y="304" width="200" height="74" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="1050.0" y="337.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#78350f" text-anchor="middle">Public internet</text>
<text x="1050.0" y="357.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">private addresses refused</text>
<path d="M810,341 L948,341" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a-amber)"/>
<text x="893" y="333" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle">kernel filter</text>
<rect x="36" y="504" width="340" height="56" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<text x="206.0" y="528.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">site.conf -&gt; apply</text>
<text x="206.0" y="548.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">renders and checks every listener</text>
<rect x="420" y="504" width="340" height="56" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<text x="590.0" y="528.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">service credentials on the host</text>
<text x="590.0" y="548.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">set, unlocked for the day, or minted</text>
<rect x="804" y="504" width="340" height="56" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<text x="974.0" y="528.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">two audit logs</text>
<text x="974.0" y="548.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">access.jsonl and web.jsonl</text>
</svg>
