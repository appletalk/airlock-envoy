# The test site for test/site-checks.sh: public endpoints only.
t-site @anthropic
t-site example.com:443
t-site 1.1.1.1:443                  # an address entry
t-site port-test.invalid:8443       # a host on another port (.invalid never resolves: nothing is dialled)
t-site one.one.one.one:443          # a host whose server also answers TLS without SNI
t-other example.org:443             # another profile, without Anthropic
t-web example.org:443 web           # the public internet, and an exact entry inside an internal name
internal-name example.org example.net   # public domains, marked internal to test the web refusals
# Plain HTTP: httpbin under the github-api rules (it echoes what arrives: the injected
# credential, the pinned Host), GitHub's git under the git rules, and api.github.com with a
# dummy credential for gh over the socket (GitHub answers 401, which proves the path).
http httpbin.org rules github-api credential t-cred
http github.com rules git
http api.github.com rules github-api credential t-gh
# httpbingo (another echo service) under the github-issues rules: issues, no PR writes.
http httpbingo.org rules github-issues credential t-cred projects PVT_test1
# ...and a variant of it for t-other: another identity (t-gh) and the full GitHub rules.
http httpbingo.org@alt rules github-api credential t-gh
t-other http://httpbingo.org@alt
# ...and httpbin.org under the forgejo rules for t-other (git paths and Forgejo's REST API).
http httpbin.org@fj rules forgejo credential t-cred
t-other http://httpbin.org@fj
t-http @anthropic web http://httpbin.org http://github.com http://api.github.com http://httpbingo.org
# repos: GitHub's git and API scoped to a few repos for t-other (the dummy credential: a 401 is
# GitHub's answer, a 403 is Envoy's), and the forgejo rules on httpbin scoped to o/r for t-site.
http github.com@repo rules git repos octocat/hello-world
http api.github.com@repo rules github-api credential t-gh repos octocat/hello-world,octo-org/*
t-other http://github.com@repo http://api.github.com@repo
http httpbin.org@fjrepo rules forgejo credential t-cred repos o/r
t-site http://httpbin.org@fjrepo
# Several definitions of one host, a credential each, chosen by repo: httpbingo echoes any path
# under /anything/, so the repos anything/a and anything/b show which credential each carries.
http httpbingo.org@ra rules git credential t-cred repos anything/a
http httpbingo.org@rb rules git credential t-gh repos anything/b
t-site http://httpbingo.org@ra http://httpbingo.org@rb
# Claude only: the built-in anthropic has no socket of its own, so a listener gives it one.
t-anthropic @anthropic
# Who may connect to each (render does not look the users up; an apply does).
client t-site tester
client t-other tester
client t-web tester
client t-http tester
client t-anthropic tester
