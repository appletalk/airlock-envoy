# The test site for test/site-checks.sh: public endpoints only.
t-site @anthropic
t-site example.com:443
t-site 1.1.1.1:443                  # an address entry
t-site tls-v1-2.badssl.com:1012     # a host on another port
t-site one.one.one.one:443          # a host whose server also answers TLS without SNI
t-other example.org:443             # another profile, without Anthropic
t-web example.org:443 web           # the public internet, and an exact entry inside an internal name
internal-name example.org example.net   # public domains, marked internal to test the web refusals
# Plain HTTP: httpbin under the github-api rules (it echoes what arrives: the injected
# credential, the pinned Host), GitHub's git under the git rules, and api.github.com with a
# dummy credential for gh over the socket (GitHub answers 401, which proves the path).
http httpbin.org rules github-api credential t-cred
http github.com rules git
http api.github.com rules github-api credential t-gh
t-http @anthropic web http://httpbin.org http://github.com http://api.github.com
