# Spike test 1: a log-only CONNECT tunnel, to learn which hosts a client needs.
# Any host on port 443 is allowed, on loopback TCP; everything else is refused.
# NOT for regular use. While it runs, any process or user on this host can tunnel to any
# host on 443, including this host's own loopback, link-local (cloud metadata) and LAN
# addresses. Run it only for a capture, then stop it.

admin:
  address:
    pipe:
      path: /run/envoy/admin.sock
      mode: 0600

static_resources:
  listeners:
  - name: tunnel
    address:
      socket_address: { address: 127.0.0.1, port_value: 18080 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: tunnel
          codec_type: HTTP1
          access_log_options:
            flush_log_on_tunnel_successfully_established: true
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  time: "%START_TIME%"
                  method: "%REQ(:METHOD)%"
                  authority: "%REQ(:AUTHORITY)%"
                  status: "%RESPONSE_CODE%"
                  flags: "%RESPONSE_FLAGS%"
                  details: "%RESPONSE_CODE_DETAILS%"
                  upstream: "%UPSTREAM_HOST%"
                  bytes_in: "%BYTES_RECEIVED%"
                  bytes_out: "%BYTES_SENT%"
                  duration_ms: "%DURATION%"
                  log_type: "%ACCESS_LOG_TYPE%"
          upgrade_configs:
          - upgrade_type: CONNECT
          route_config:
            name: tunnel
            virtual_hosts:
            - name: tunnel
              domains: ["*"]
              routes:
              - match:
                  connect_matcher: {}
                  headers:
                  - name: ":authority"
                    string_match: { suffix: ":443" }
                route:
                  cluster: dynamic_forward_proxy
                  upgrade_configs:
                  - upgrade_type: CONNECT
                    connect_config: {}
          http_filters:
          - name: envoy.filters.http.dynamic_forward_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
              dns_cache_config: &dns_cache
                name: dynamic_forward_proxy
                dns_lookup_family: ALL
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: dynamic_forward_proxy
    lb_policy: CLUSTER_PROVIDED
    cluster_type:
      name: envoy.clusters.dynamic_forward_proxy
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
        dns_cache_config: *dns_cache
