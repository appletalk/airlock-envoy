# The service account that runs Envoy and owns its sockets (a system account, so
# claude-airlock accepts its sockets).
u airlock-envoy - "airlock Envoy egress proxy"
# The account that mints GitHub App tokens (airlock-envoy-mint): it alone reads an App's key;
# Envoy reads only the tokens.
u airlock-envoy-mint - "airlock Envoy GitHub App token minting"
