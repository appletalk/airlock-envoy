name: ci

# The suites of docs/testing.md, split by what they need:
#
#   lint     shellcheck, the pinned and verified one claude-airlock vendors.
#   checks   everything that needs no podman: the parser, the Lua checks, protect, credentials
#            and App minting; the parser, protect-e2e, cred-e2e and mint-e2e with a real Envoy
#            installed by install-envoy.sh.
#   install  the whole install in a systemd-booted container, per distribution.
#   spike    t2 and the site checks from a box-shaped client, which builds on claude-airlock's
#            dev image.
#
# The site-details check (scripts/private-names-check --tree HEAD) is not here: its pattern
# list is private, so it runs before publishing instead. Its own tests run in checks.
#
# claude-airlock is checked out at its main, not pinned: the two are developed together, and
# the install test checks against claude-airlock's current socket check and manifest reader.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The version test/install-test.sh installs by default. test/run-envoy.sh pins its own image
  # (by digest): bump both together.
  ENVOY_VERSION: 1.40.2

defaults:
  run:
    shell: bash   # -e and pipefail
    working-directory: airlock-envoy

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: airlock-envoy
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: appletalk/claude-airlock
          path: claude-airlock
          persist-credentials: false
      # Lint findings depend on shellcheck's version: the runner's own is not the one a box has.
      - name: Vendor pinned shellcheck
        run: bash ../claude-airlock/scripts/bootstrap-tools.sh
      - run: SHELLCHECK=../claude-airlock/.tooling/bin/shellcheck test/lint.sh

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: airlock-envoy
          persist-credentials: false
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y luajit socat acl python3-yaml
      # The real installer, so its signature checks run too.
      - name: Install Envoy ${{ env.ENVOY_VERSION }}
        run: sudo install/install-envoy.sh "$ENVOY_VERSION" && envoy --version
      # A suite that is missing a tool exits 3 (skipped): here that fails the step, as it should.
      # Two skip parts of themselves (no PyYAML, no envoy, a uid under 1000; no luajit) and go
      # on: their skip lines fail the step too.
      - run: |
          test/apply-parse.sh | tee "$RUNNER_TEMP/apply-parse.log"
          if grep '^skip' "$RUNNER_TEMP/apply-parse.log"; then exit 1; fi
      - run: test/private-names-check-test.sh
      - run: luajit test/graphql-check.lua
      - run: luajit test/git-protect-check.lua
      - run: |
          test/protect-e2e.sh | tee "$RUNNER_TEMP/protect-e2e.log"
          if grep '^skip' "$RUNNER_TEMP/protect-e2e.log"; then exit 1; fi
      - run: test/cred-backends.sh
      - run: test/cred-e2e.sh
      - run: test/mint.sh
      - run: test/mint-e2e.sh

  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, debian, ubuntu-26.04]   # test/run-all.sh's defaults
    steps:
      - uses: actions/checkout@v7
        with:
          path: airlock-envoy
          persist-credentials: false
      # For the install test's run of claude-airlock's own socket check.
      - uses: actions/checkout@v7
        with:
          repository: appletalk/claude-airlock
          path: claude-airlock
          persist-credentials: false
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman uidmap dbus-user-session
      # systemd in a rootless container needs a cgroup it may write, which podman gets only
      # through the user's own systemd manager: the runner user has none until it lingers.
      - name: A systemd user manager for the runner user
        run: |
          sudo loginctl enable-linger "$(id -un)"
          uid=$(id -u)
          for _ in $(seq 100); do [ -S "/run/user/$uid/bus" ] && break; sleep 0.1; done
          [ -S "/run/user/$uid/bus" ] || { echo "::error::no user bus after enable-linger"; exit 1; }
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
      - name: podman uses systemd cgroups
        run: |
          m=$(podman info --format '{{.Host.CgroupManager}}')
          echo "cgroup manager: $m"
          [ "$m" = systemd ]
      - name: Install test (${{ matrix.distro }})
        run: AIRLOCK_REPO="$GITHUB_WORKSPACE/claude-airlock" test/install-test.sh "${{ matrix.distro }}" "$ENVOY_VERSION"

  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: airlock-envoy
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: appletalk/claude-airlock
          path: claude-airlock
          persist-credentials: false
      # passt: run-envoy.sh runs Envoy on pasta.
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman passt uidmap
      # The test client is claude-airlock's dev image plus socat.
      - name: Build the test client
        working-directory: claude-airlock
        run: |
          podman build -t claude-airlock:base image
          podman build --target os -t claude-airlock:os image
          podman build -t claude-airlock:dev image/dev
          podman build -t localhost/airlock-envoy-spike-client:test "$GITHUB_WORKSPACE/airlock-envoy/test/client"
      - name: t2
        run: |
          test/run-envoy.sh test/t2.conf
          trap 'podman stop --ignore airlock-envoy-spike airlock-envoy-web-spike >/dev/null' EXIT
          test/t2-checks.sh
      - name: Site checks
        run: |
          test/run-envoy.sh test/site.conf
          trap 'podman stop --ignore airlock-envoy-spike airlock-envoy-web-spike >/dev/null' EXIT
          test/site-checks.sh
